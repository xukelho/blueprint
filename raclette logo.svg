<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Technical raclette spatula icon with downward-tapering blade</title>
  <desc id="desc">A one-piece raclette spatula with a narrow handle and a broad triangular paddle tapering downward to a short scraping edge, drawn only with blue vector lines.</desc>

  <g fill="none" stroke="#2563EB" stroke-linecap="round" stroke-linejoin="round">
    <!-- One-piece raclette spatula: wide shoulders, downward-pointing triangular blade -->
    <path stroke-width="10" d="
      M236 54
      Q226 54 226 66
      L226 202
      Q226 220 207 232
      L119 267
      Q102 274 112 290
      L204 427
      Q214 442 232 442
      L280 442
      Q298 442 308 427
      L400 290
      Q410 274 393 267
      L305 232
      Q286 220 286 202
      L286 66
      Q286 54 276 54
      Z"/>

    <!-- Hanging hole -->
    <circle cx="256" cy="88" r="13" stroke-width="8"/>

    <!-- Blade shoulder / manufacturing transition -->
    <path d="M119 267 Q256 225 393 267" stroke-width="6"/>

    <!-- Technical centerline -->
    <path d="M256 35 L256 466" stroke-width="4" stroke-dasharray="12 14"/>

    <!-- Triangular construction guides -->
