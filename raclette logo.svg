    <!-- Maximum blade-width dimension -->
    <path d="M101 315 L411 315" stroke-width="4"/>
    <path d="M101 299 L101 331 M411 299 L411 331" stroke-width="4"/>

    <!-- Scraping-tip dimension -->
    <path d="M204 475 L308 475" stroke-width="4"/>
    <path d="M204 458 L204 488 M308 458 L308 488" stroke-width="4"/>

    <!-- Small datum marks -->
    <path d="M94 267 L122 267 M108 253 L108 281" stroke-width="4"/>
    <path d="M390 267 L418 267 M404 253 L404 281" stroke-width="4"/>
  </g>
</svg>
